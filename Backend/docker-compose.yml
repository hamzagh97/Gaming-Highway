services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gh
      POSTGRES_PASSWORD: gh_dev_password
      POSTGRES_DB: gaming_highway
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
volumes:
  pgdata:
